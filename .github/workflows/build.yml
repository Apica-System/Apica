name: Test, Build and Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.compare.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^#define VERSION' inc/utils/constants.hpp | sed -E 's/^#define VERSION "([^"]+)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare with latest release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v0.0.0")
          LATEST=${LATEST#v}

          if [ "$(printf '%s\n' "$LATEST" "${{ steps.version.outputs.version }}" | sort -V | tail -n1)" = "${{ steps.version.outputs.version }}" ] &&
             [ "$LATEST" != "${{ steps.version.outputs.version }}" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
            ext: ""
            artifact: Apica-linux

          - os: macos-latest
            cxx: clang++
            ext: ""
            artifact: Apica-macos

          - os: windows-latest
            cxx: g++
            ext: .exe
            artifact: Apica-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      #################################################
      # Linux
      #################################################
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            make \
            pkg-config \
            libsdl3-dev \
            libsdl3-image-dev \
            libsdl3-mixer-dev \
            libsdl3-ttf-dev

      #################################################
      # macOS
      #################################################
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install sdl3 sdl3_image sdl3_mixer sdl3_ttf pkg-config

      #################################################
      # Windows (MSYS2)
      #################################################
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL3
            mingw-w64-ucrt-x86_64-SDL3_image
            mingw-w64-ucrt-x86_64-SDL3_mixer
            mingw-w64-ucrt-x86_64-SDL3_ttf

      #################################################
      # Build
      #################################################

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          make build \
            CXX="${{ matrix.cxx }}" \
            EXT="${{ matrix.ext }}" \
            SDL_DIR=""

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make build \
            CXX="${{ matrix.cxx }}" \
            EXT="${{ matrix.ext }}" \
            SDL_DIR=""

      #################################################
      # Package
      #################################################

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp Apica${{ matrix.ext }} dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs:
      - check-version
      - build

    if: github.event_name == 'push' && needs.check-version.outputs.should_release == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(find artifacts -type f)

          gh release create \
            v${{ needs.check-version.outputs.version }} \
            $FILES \
            --title "v${{ needs.check-version.outputs.version }}" \
            --notes "Automated release"