name: Test, Build and Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.compare.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP '#define\s+VERSION\s+"\K[^"]+' inc/utils/constants.hpp)
          if [ -z "$VERSION" ]; then
            echo "::error::Impossible d'extraire VERSION depuis inc/utils/constants.hpp"
            exit 1
          fi
          echo "Version détectée : $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare with latest release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v0.0.0")
          LATEST=${LATEST#v}

          if [ "$(printf '%s\n' "$LATEST" "${{ steps.version.outputs.version }}" | sort -V | tail -n1)" = "${{ steps.version.outputs.version }}" ] &&
             [ "$LATEST" != "${{ steps.version.outputs.version }}" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
            ext: ""
            artifact: Apica-linux.tar.gz
            shadercross_url: "https://nightly.link/libsdl-org/SDL_shadercross/workflows/main/main/SDL3_shadercross-linux-x64.zip"

          - os: macos-latest
            cxx: clang++
            ext: ""
            artifact: Apica-macos.zip
            shadercross_url: "https://nightly.link/libsdl-org/SDL_shadercross/workflows/main/main/SDL3_shadercross-macos-arm64.zip"

          - os: windows-latest
            cxx: g++
            ext: .exe
            artifact: Apica-windows.zip
            shadercross_url: "https://nightly.link/libsdl-org/SDL_shadercross/workflows/main/main/SDL3_shadercross-VC-x64.zip"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      #################################################
      # Linux Dependencies
      #################################################
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            make \
            pkg-config \
            cmake \
            ninja-build \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libgl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libfreetype-dev \
            libharfbuzz-dev

          # Compilation et installation rapide de SDL3
          git clone https://github.com/libsdl-org/SDL.git --depth 1 -b main
          cd SDL && mkdir build && cd build
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build . --target install
          cd ../.. && rm -rf SDL

          # Compilation et installation des extensions nécessaires
          for repo in SDL_image SDL_mixer SDL_ttf; do
            git clone https://github.com/libsdl-org/$repo.git --depth 1
            cd $repo && mkdir build && cd build
            cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release
            sudo cmake --build . --target install
            cd ../.. && rm -rf $repo
          done

          # Rafraîchir les liens système pour que le linker trouve les nouvelles .so
          sudo ldconfig

      #################################################
      # macOS Dependencies
      #################################################
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install sdl3 sdl3_image sdl3_mixer sdl3_ttf pkg-config

      #################################################
      # Windows Dependencies (MSYS2)
      #################################################
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            unzip
            curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-image
            mingw-w64-ucrt-x86_64-sdl3-mixer
            mingw-w64-ucrt-x86_64-sdl3-ttf

      #################################################
      # Download & Clean SDL_shadercross
      #################################################
      - name: Fetch and Install SDL_shadercross Nightly (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p shadercross_temp
          curl -L "${{ matrix.shadercross_url }}" -o shadercross_temp/shadercross.zip
          cd shadercross_temp && unzip shadercross.zip && rm shadercross.zip

          # Si c'est l'archive macOS, elle contient un .tar.gz qu'il faut extraire
          if [ -f *.tar.gz ]; then
            tar -xzf *.tar.gz --strip-components=1 2>/dev/null || tar -xzf *.tar.gz
          fi

          # Nettoyage récursif : on supprime toute libSDL3 embarquée,
          # peu importe le sous-dossier où l'archive shadercross l'a placée
          find . -type f \( -name "libSDL3.so*" -o -name "libSDL3.dylib" -o -name "libSDL3.*.dylib" \) -print -delete

          cd ..

          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "--- Structure extraite (Linux) ---"
            find shadercross_temp -maxdepth 2
            echo "------------------------------------"

            sudo cp -r shadercross_temp/include/* /usr/include/

            SO_FILE=$(find shadercross_temp -type f -name "libSDL3_shadercross.so*" | head -n 1)
            if [ -z "$SO_FILE" ]; then
              echo "::error::libSDL3_shadercross.so introuvable dans l'archive extraite"
              exit 1
            fi
            sudo cp "$SO_FILE" /usr/lib/x86_64-linux-gnu/

            # S'assurer qu'un symlink non versionné existe pour -lSDL3_shadercross
            SO_BASENAME=$(basename "$SO_FILE")
            if [ "$SO_BASENAME" != "libSDL3_shadercross.so" ]; then
              sudo ln -sf "/usr/lib/x86_64-linux-gnu/$SO_BASENAME" /usr/lib/x86_64-linux-gnu/libSDL3_shadercross.so
            fi

            sudo ldconfig
            sudo mkdir -p /usr/lib/x86_64-linux-gnu/pkgconfig

            {
              echo "Name: sdl3-shadercross"
              echo "Description: Shadercross"
              echo "Version: 3.0.0"
              echo "Cflags: -I/usr/include"
              echo "Libs: -L/usr/lib/x86_64-linux-gnu -lSDL3_shadercross"
            } | sudo tee /usr/lib/x86_64-linux-gnu/pkgconfig/sdl3-shadercross.pc > /dev/null

          elif [ "${{ runner.os }}" = "macOS" ]; then
            # Sécurité : s'assurer que les répertoires cibles existent
            sudo mkdir -p /opt/homebrew/include /opt/homebrew/lib /opt/homebrew/lib/pkgconfig

            sudo cp -r shadercross_temp/include/* /opt/homebrew/include/
            sudo cp shadercross_temp/lib/libSDL3_shadercross*.dylib /opt/homebrew/lib/ 2>/dev/null || sudo cp shadercross_temp/libSDL3_shadercross*.dylib /opt/homebrew/lib/

            {
              echo "Name: sdl3-shadercross"
              echo "Description: Shadercross"
              echo "Version: 3.0.0"
              echo "Cflags: -I/opt/homebrew/include"
              echo "Libs: -L/opt/homebrew/lib -lSDL3_shadercross"
            } | sudo tee /opt/homebrew/lib/pkgconfig/sdl3-shadercross.pc > /dev/null
          fi

      - name: Fetch and Install SDL_shadercross Nightly (Windows MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p shadercross_temp
          curl -L "${{ matrix.shadercross_url }}" -o shadercross_temp/shadercross.zip
          cd shadercross_temp && unzip shadercross.zip && rm shadercross.zip

          # L'archive nightly.link contient un zip imbriqué à extraire
          if ls *.zip >/dev/null 2>&1; then
            unzip -o *.zip
            rm -f *.zip
          fi

          echo "--- Structure extraite (avant aplatissement) ---"
          find . -maxdepth 2
          echo "-------------------------------------------------"

          # Le zip imbriqué extrait dans un sous-dossier
          # (ex: SDL3_shadercross-3.0.0-windows-VC-x64/). On aplatit
          # ce contenu à la racine de shadercross_temp/ s'il existe.
          NESTED_DIR=$(find . -mindepth 1 -maxdepth 1 -type d -name "SDL3_shadercross*" | head -n 1)
          if [ -n "$NESTED_DIR" ]; then
            cp -r "$NESTED_DIR"/* .
            rm -rf "$NESTED_DIR"
          fi

          echo "--- Structure extraite (après aplatissement) ---"
          find . -maxdepth 2
          echo "-------------------------------------------------"

          # Nettoyage récursif : on supprime toute SDL3.dll embarquée dans l'archive
          find . -type f -iname "SDL3.dll" -print -delete

          cd ..

          cp -r shadercross_temp/include/* /ucrt64/include/
          cp shadercross_temp/lib/SDL3_shadercross.lib /ucrt64/lib/
          cp shadercross_temp/*.dll /ucrt64/bin/ 2>/dev/null || true
          cp shadercross_temp/bin/*.dll /ucrt64/bin/ 2>/dev/null || true

          mkdir -p /ucrt64/lib/pkgconfig
          {
            echo "Name: sdl3-shadercross"
            echo "Description: Shadercross"
            echo "Version: 3.0.0"
            echo "Cflags: -I/ucrt64/include"
            echo "Libs: -L/ucrt64/lib -lSDL3_shadercross"
          } > /ucrt64/lib/pkgconfig/sdl3-shadercross.pc

      #################################################
      # Build
      #################################################

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          # Sous macOS, on indique à pkg-config où trouver le .pc de shadercross qu'on a créé
          if [ "${{ runner.os }}" = "macOS" ]; then
            export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH"
          fi

          # On appelle make sans forcer SDL_DIR ni BUILD_DIR pour laisser pkg-config agir
          make build \
            CXX="${{ matrix.cxx }}" \
            EXT="${{ matrix.ext }}" \
            SDL_DIR="" \
            BUILD_DIR=""

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make build \
            CXX="${{ matrix.cxx }}" \
            EXT="${{ matrix.ext }}" \
            SDL_DIR="" \
            BUILD_DIR=""

      #################################################
      # Package
      #################################################

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/Apica-linux
          cp Apica dist/Apica-linux/

          # COPIE DEPUIS /usr/local/lib/ car compilé à la main
          cp /usr/local/lib/libSDL3*.so* dist/Apica-linux/ 2>/dev/null || true
          cp shadercross_temp/*.so* dist/Apica-linux/ 2>/dev/null || true

          echo '#!/bin/sh' > dist/Apica-linux/Apica.sh
          echo 'ORIGIN=$$(dirname "$$(readlink -f "$$0")")' >> dist/Apica-linux/Apica.sh
          echo 'export LD_LIBRARY_PATH="$$ORIGIN:$$LD_LIBRARY_PATH"' >> dist/Apica-linux/Apica.sh
          echo 'exec "$$ORIGIN/Apica" "$$@"' >> dist/Apica-linux/Apica.sh
          chmod +x dist/Apica-linux/Apica.sh
          chmod +x dist/Apica-linux/Apica

          cd dist
          tar -czvf Apica-linux.tar.gz Apica-linux/
          rm -rf Apica-linux

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/Apica.app/Contents/MacOS
          mkdir -p dist/Apica.app/Contents/Frameworks
          cp Apica dist/Apica.app/Contents/MacOS/

          cp /opt/homebrew/lib/libSDL3*.dylib dist/Apica.app/Contents/Frameworks/ 2>/dev/null || true
          cp shadercross_temp/*.dylib dist/Apica.app/Contents/Frameworks/ 2>/dev/null || true

          cd dist
          zip -r Apica-macos.zip Apica.app/
          rm -rf Apica.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist/Apica-windows
          cp Apica.exe dist/Apica-windows/

          cp /ucrt64/bin/SDL3.dll dist/Apica-windows/
          cp /ucrt64/bin/SDL3_image.dll dist/Apica-windows/
          cp /ucrt64/bin/SDL3_mixer.dll dist/Apica-windows/
          cp /ucrt64/bin/SDL3_ttf.dll dist/Apica-windows/
          cp /ucrt64/bin/libstdc++-6.dll dist/Apica-windows/
          cp /ucrt64/bin/libgcc_s_seh-1.dll dist/Apica-windows/
          cp /ucrt64/bin/libwinpthread-1.dll dist/Apica-windows/

          cp shadercross_temp/*.dll dist/Apica-windows/ 2>/dev/null || true
          cp shadercross_temp/bin/*.dll dist/Apica-windows/ 2>/dev/null || true

          cd dist
          zip -r Apica-windows.zip Apica-windows/
          rm -rf Apica-windows

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs:
      - check-version
      - build

    if: needs.check-version.outputs.should_release == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(find artifacts -type f)

          gh release create \
            v${{ needs.check-version.outputs.version }} \
            $FILES \
            --title "v${{ needs.check-version.outputs.version }}" \
            --notes "Automated release"